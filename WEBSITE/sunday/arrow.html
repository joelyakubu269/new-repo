<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1></h1>
    <script class="js">
        function thisFunc(str){
            try {
                
           
            let vowels=0;
            let v=['a','i','e','o','u'];
          v.forEach((data)=>{
            if(str.includes(data)) {
                     vowels++;
            }
               
          }
        
        )
        document.querySelector('h1').innerHTML=vowels;
         } catch (error) {
                alert(error.stack)
            }
        }
        
        thisFunc('bizi');
    </script>
</body>
</html>
