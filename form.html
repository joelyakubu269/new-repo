<!DOCTYPE html>
<html>

<head>
    <title> learning html forms </title>
</head>

<body>
    <p>
    <h1>html forms</h1>
    </p>
    <form>
        <label for="username">enter username</label>
        <input type="text" id="username" name="username">
        <br><br>
        <label for="email">enter email</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="password">password</label>
        <input type="password" id="password" name="password">

        <p>select your age</p>

        <input type="radio" id="option 1" name="age" value="0-25">
        <label for="option 1">0-25</label>
        <input type="radio" id="option 2" name="age" value="26-50">
        <label for="option 2">26-50</label>
        <input type="radio" id="option 3" name="age" value="51+">
        <label for="option 3">51+</label>

        <br><br>
        <label for="question">security question</label>
        <select name="questions" id="question">
            <option value="q1">what is your <name>?</option>
            <option value="q2">how old are you?</option>
            <option value="q3">what is your gender</option>
        </select>


        <br><br>
        <label for="answer">security question answer</label>
        <input type="text" id="answer" name="answer">

        <br><br>


        <label for="bio">your bio</label><br>
        <textarea name="bio" id="name" cols="30" rows="15" placeholder="about you"></textarea>
















    </form>






</body>

</html>
